name: finemtec-data-update

on:
  schedule:
    - cron: "7-57/10 * * * *" # Fixed publication time is unknown: poll every 10 minutes, including weekends.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch_finemtec.py
      - data_writer.py
      - publish_pages.py
      - ingest_finemtec_trade.py
      - data_sources/finemtec_trade_rules.json
      - .github/workflows/finemtec.yml

permissions:
  contents: write
  pages: write

# Independent cadence; the publication step rebases onto other collectors' commits.
concurrency:
  group: finemtec-source-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 주가와 확정 실적 갱신
        id: financials
        continue-on-error: true
        run: python fetch_finemtec.py --only-if-changed
      - name: 연결된 베트남 거래 원본 검증 및 집계
        id: trade
        continue-on-error: true
        env:
          FINEMTEC_TRADE_FEED_URL: ${{ secrets.FINEMTEC_TRADE_FEED_URL }}
          FINEMTEC_TRADE_FEED_TOKEN: ${{ secrets.FINEMTEC_TRADE_FEED_TOKEN }}
        run: python ingest_finemtec_trade.py
      - name: 데이터 저장
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/finemtec.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Fine M-Tec prices and fundamentals"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: 사이트 미게시 변경 복구
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
      - name: 갱신 실패 상태 알림
        if: steps.financials.outcome == 'failure' || steps.trade.outcome == 'failure'
        run: |
          echo "일부 원본 갱신 실패. 마지막 성공 값과 갱신 상태를 보존했습니다."
          exit 1
