name: memory-price-publication-window
on:
  schedule:
    # General session times, Taipei 11:00 / 14:40 / 18:10.
    # Source publication and GitHub scheduling delays are not guaranteed.
    - cron: "0,5,10,15,20 3 * * *" # KST 12:00~12:20
    - cron: "40,45,50,55 6 * * *" # KST 15:40~15:55
    - cron: "0 7 * * *" # KST 16:00
    - cron: "10,15,20,25,30 10 * * *" # KST 19:10~19:30
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: memory-price-source-update
  cancel-in-progress: false
jobs:
  update:
    # Explicit operator enablement requires provider permission for both collection
    # and PUBLIC redistribution. A paid TRASS subscription does not grant this.
    if: vars.MEMORY_PRICE_COLLECTION_ALLOWED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 현물 세션과 공개 계약표 변경 확인
        id: prices
        continue-on-error: true
        env:
          MEMORY_PRICE_COLLECTION_ALLOWED: ${{ vars.MEMORY_PRICE_COLLECTION_ALLOWED }}
        run: python fetch_memory.py --only-if-changed
      - name: 관측값 변경 시 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/memory.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh permitted memory price observations"
            for attempt in 1 2 3; do
              git pull --rebase origin main || exit 1
              if git push; then exit 0; fi
            done
            exit 1
          fi
      - name: 사이트 미게시 변경 복구
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_pages.py
      - name: 수집 실패 표시
        if: steps.prices.outcome == 'failure'
        run: exit 1
